<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>改動從寫完到合併會經過的檢查（依原文整理）</title><desc>流程圖：改動寫完後，先跑測試、build、linter，再用 verify skill 把 app 跑起來看，經過 commit 閘門與審查後合併；任一檢查失敗由 Claude 修正後重跑，同一檢查三輪仍失敗就交給人；事故、revert 與審查漏網被整理成規則回饋到審查，並定期修剪。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8377"/></marker></defs><rect width="900" height="1600" fill="#fbf9f5"/><rect x="150" y="60" width="460" height="110" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="380" y="106" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">改動寫完</text><text x="380" y="142" font-size="20" font-weight="400" fill="#5f5b54" text-anchor="middle">Claude 撰寫</text><path d="M380,172 L380,211" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="215" width="460" height="110" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="380" y="261" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">先跑便宜檢查</text><text x="380" y="297" font-size="20" font-weight="400" fill="#5f5b54" text-anchor="middle">測試・build・linter</text><path d="M380,327 L380,366" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="370" width="460" height="110" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="380" y="416" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">verify skill</text><text x="380" y="452" font-size="20" font-weight="400" fill="#5f5b54" text-anchor="middle">把 app 跑起來看</text><path d="M380,482 L380,521" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="525" width="460" height="170" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="380" y="571" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">commit 閘門</text><text x="380" y="607" font-size="20" font-weight="400" fill="#5f5b54" text-anchor="middle">off → observe → enforce</text><text x="380" y="641" font-size="18" font-weight="400" fill="#1a1a1a" text-anchor="middle">每個 commit 標記</text><text x="380" y="671" font-size="18" font-weight="400" fill="#1a1a1a" text-anchor="middle">驗證方式（含 none）</text><path d="M380,697 L380,736" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="740" width="460" height="170" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="380" y="786" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">審查</text><text x="380" y="822" font-size="20" font-weight="400" fill="#5f5b54" text-anchor="middle">依 diff 觸發清單項目</text><text x="380" y="856" font-size="18" font-weight="400" fill="#1a1a1a" text-anchor="middle">REVIEW.md 讀自基底或預設分支</text><text x="380" y="886" font-size="18" font-weight="400" fill="#1a1a1a" text-anchor="middle">改動改不到自己的檢查</text><path d="M380,912 L380,951" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="150" y="955" width="460" height="110" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="380" y="1001" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">合併</text><text x="380" y="1037" font-size="20" font-weight="400" fill="#5f5b54" text-anchor="middle">事後追蹤 revert</text><path d="M148,825 L90,825 L90,115 L146,115" fill="none" stroke="#a3392b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="62" y="460" font-size="20" font-weight="600" fill="#a3392b" text-anchor="middle" transform="rotate(-90 62 460)">任一檢查失敗：Claude 修正後重跑</text><path d="M90,825 L90,1096" fill="none" stroke="#a3392b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="40" y="1100" width="400" height="100" rx="14" fill="#fbe9e4" stroke="#a3392b" stroke-width="2"/><text x="240" y="1142" font-size="22" font-weight="700" fill="#a3392b" text-anchor="middle">同一檢查三輪仍失敗</text><text x="240" y="1178" font-size="22" font-weight="700" fill="#a3392b" text-anchor="middle">停下來交給人</text><rect x="40" y="1270" width="400" height="110" rx="14" fill="#ffffff" stroke="#8a8377" stroke-width="2"/><text x="240" y="1332" font-size="22" font-weight="600" fill="#1a1a1a" text-anchor="middle">事故、revert、審查漏網</text><path d="M442,1325 L476,1325" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="1270" width="390" height="110" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="675" y="1314" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle">整理成規則</text><text x="675" y="1352" font-size="19" font-weight="400" fill="#5f5b54" text-anchor="middle">REVIEW.md・可靠性清單</text><path d="M675,1268 L675,825 L614,825" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><text x="675" y="1430" font-size="22" font-weight="600" fill="#5f5b54" text-anchor="middle">定期修剪</text></svg>
