<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>改動從寫完到合併會經過的檢查（依原文整理）</title><desc>流程圖：改動寫完後，先跑測試、build、linter，再用 verify skill 把 app 跑起來看，經過 commit 閘門與審查後合併；任一檢查失敗由 Claude 修正後重跑，同一檢查三輪仍失敗就交給人；事故、revert 與審查漏網被整理成規則回饋到審查，並定期修剪。</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8377"/></marker></defs><rect width="1600" height="900" fill="#fbf9f5"/><rect x="40" y="330" width="220" height="120" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="150" y="382" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">改動寫完</text><text x="150" y="418" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">Claude 撰寫</text><path d="M262,390 L298,390" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="300" y="330" width="220" height="120" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="410" y="382" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">先跑便宜檢查</text><text x="410" y="418" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">測試・build・linter</text><path d="M522,390 L558,390" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="560" y="330" width="220" height="120" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="670" y="382" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">verify skill</text><text x="670" y="418" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">把 app 跑起來看</text><path d="M782,390 L818,390" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="820" y="330" width="220" height="120" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="930" y="382" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">commit 閘門</text><text x="930" y="418" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">off → observe → enforce</text><path d="M1042,390 L1078,390" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1080" y="330" width="220" height="120" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="1190" y="382" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">審查</text><text x="1190" y="418" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">依 diff 觸發清單項目</text><path d="M1302,390 L1338,390" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1340" y="330" width="220" height="120" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="1450" y="382" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle">合併</text><text x="1450" y="418" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">事後追蹤 revert</text><rect x="802" y="214" width="256" height="86" rx="14" fill="#f0ebe1" stroke="#8a8377" stroke-width="1"/><text x="930" y="250" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle">每個 commit 標記</text><text x="930" y="280" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle">驗證方式（含 none）</text><line x1="930" y1="300" x2="930" y2="330" stroke="#8a8377" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="1062" y="214" width="256" height="86" rx="14" fill="#f0ebe1" stroke="#8a8377" stroke-width="1"/><text x="1190" y="250" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle">REVIEW.md 讀自基底或預設分支</text><text x="1190" y="280" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle">改動改不到自己的檢查</text><line x1="1190" y1="300" x2="1190" y2="330" stroke="#8a8377" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M1190,452 L1190,520 L150,520 L150,456" fill="none" stroke="#a3392b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="670" y="556" font-size="18" font-weight="600" fill="#a3392b" text-anchor="middle">任一檢查失敗：Claude 修正後重跑</text><path d="M360,520 L360,596" fill="none" stroke="#a3392b" stroke-width="2.5" marker-end="url(#ah)"/><rect x="200" y="600" width="320" height="92" rx="14" fill="#fbe9e4" stroke="#a3392b" stroke-width="2"/><text x="360" y="638" font-size="19" font-weight="700" fill="#a3392b" text-anchor="middle">同一檢查三輪仍失敗</text><text x="360" y="672" font-size="19" font-weight="700" fill="#a3392b" text-anchor="middle">停下來交給人</text><rect x="580" y="740" width="330" height="100" rx="14" fill="#ffffff" stroke="#8a8377" stroke-width="2"/><text x="745" y="797" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="middle">事故、revert、審查漏網</text><path d="M912,790 L976,790" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><rect x="980" y="740" width="400" height="100" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="2"/><text x="1180" y="780" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle">整理成規則</text><text x="1180" y="814" font-size="16" font-weight="400" fill="#5f5b54" text-anchor="middle">REVIEW.md・可靠性清單</text><path d="M1250,738 L1250,456" fill="none" stroke="#0b5c51" stroke-width="2.5" marker-end="url(#ah)"/><text x="1485" y="797" font-size="18" font-weight="600" fill="#5f5b54" text-anchor="middle">定期修剪</text></svg>
